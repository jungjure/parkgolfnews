<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 - 파크골프뉴스</title>
<meta name="description" content="파크골프뉴스 관리자 로그인">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261010d">
</head>
<body>
<div class="wrap">
  <div class="card authbox">
    <h2>로그인</h2>
    <p class="sub">댓글은 회원만 쓸 수 있습니다.</p>
    <div id="notice"></div>
    <form id="f" autocomplete="on">
      <label class="field"><span>아이디</span><input id="id" name="username" autocomplete="username" required></label>
      <label class="field"><span>비밀번호</span><input id="pw" name="password" type="password" autocomplete="current-password" required></label>
      <label class="chk"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지 (7일)</label>
      <div id="msg"></div>
      <button class="btn green big" id="go" type="submit">로그인</button>
    </form>
    <div class="linkrow finds"><a href="find.html?tab=id">아이디 찾기</a><span>|</span><a href="find.html?tab=pw">비밀번호 찾기</a></div>
    <div id="social"></div>
    <div class="linkrow">아직 회원이 아니신가요? <a id="tosignup" href="signup.html">회원가입</a></div>
  </div>
</div>
<script src="assets/app.js?v=20261010d"></script>
<script>
(async () => {
  await layout('login');
  pwEye('#pw');
  const nextUrl = () => { const n = new URLSearchParams(location.search).get('next') || ''; return /^[\w.\-]+\.html(\?[\w=&%\-]*)?$/.test(n) ? n : ''; };
  const go = r => { const n = nextUrl(); location.href = n || (r === 'admin' ? 'write.html' : 'index.html'); };
  if (nextUrl()) $('#tosignup').href = 'signup.html?next=' + encodeURIComponent(nextUrl());
  if (nextUrl()) $('#notice').innerHTML = '<div class="msg warn">로그인이 필요한 페이지입니다. 로그인하시면 보시던 페이지로 바로 이동합니다.</div>';
  const cur = Auth.get(); if (cur) { go(cur.role); return; }
  if (!CONFIG.API_URL) $('#notice').innerHTML = '<div class="msg warn">서버 연결이 아직 설정되지 않았습니다. 설정이 끝나면 로그인할 수 있습니다.</div>';
  renderSocial($('#social'), nextUrl());
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#go'), m = $('#msg'); b.disabled = true; b.textContent = '확인 중...'; m.innerHTML = '';
    try {
      const r = await api('login', { id: $('#id').value.trim(), pw: $('#pw').value });
      Auth.set({ token: r.token, exp: r.exp, role: r.role, name: r.name || '' }, $('#keep').checked);
      b.textContent = '이동 중...';
      go(r.role);
    } catch (e) { m.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; b.disabled = false; b.textContent = '로그인'; $('#pw').value = ''; }
  };
})();
</script>
</body>
</html>
