<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>길안내 · 파크골프뉴스</title>
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;background:#F7F3EA;color:#14342A;-webkit-text-size-adjust:100%}
.top{background:#14342A;color:#F0D9A6;padding:14px 18px;font-size:14px;font-weight:700;letter-spacing:.02em}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;line-height:1.35;margin:4px 0 4px}
.addr{font-size:14px;color:#5b6b63;margin:0 0 12px;min-height:1px}
.map{position:relative;width:100%;height:240px;overflow:hidden;border-radius:14px;background:#e6e2d8;border:1px solid #d9d2c3}
.tiles{position:absolute;left:0;top:0;width:768px;height:768px}
.tiles img{position:absolute;width:256px;height:256px;display:block}
.pin{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-28px 0 0 -14px;border-radius:50% 50% 50% 0;background:#B5543C;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin::after{content:'';position:absolute;left:9px;top:9px;width:10px;height:10px;border-radius:50%;background:#fff}
.attr{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:4px;color:#333}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:10px;border-radius:12px;font-size:18px;font-weight:800;text-decoration:none;-webkit-tap-highlight-color:transparent}
.b1{background:#03C75A;color:#fff}
.b2{background:#FEE500;color:#191919}
.msg{font-size:15px;color:#14342A;line-height:1.55;margin-top:12px;background:#fff;border:1px solid #e3dccd;border-radius:10px;padding:10px 12px}
.msg b{color:#B5543C}
.note{font-size:12.5px;color:#5b6b63;line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div class="top">PARKGOLF NEWS · 길안내</div>
<div class="wrap">
  <h1 id="nm">장소</h1>
  <p class="addr" id="addr"></p>
  <div class="map" id="map" style="display:none"><div class="tiles" id="tiles"></div><div class="pin"></div><div class="attr">© OpenStreetMap contributors</div></div>
  <a class="btn b1" id="bN" href="#">네이버 지도로 길안내</a>
  <a class="btn b2" id="bK" href="#">카카오맵으로 길안내</a>
  <p class="msg" id="msg" style="display:none"></p>
  <p class="note" id="note"></p>
</div>
<script>
/* 장소 길안내 (2026-11-16 새로 만듦. 사용자 지시 "장소를 누르면 네비게이션이 열리는 코드는 전체 다 지워주고 다시 만들자",
   "홈페이지와 휴대폰에서 기사나 뉴스레터에서 항상 장소를 누르면 네이버지도 카카오지도에서 자동차경로를 찾아 이동경로를 찾게해줘", "항상 장소를 부르면 그 장소값을 불러오게")
   홈페이지(일정·기사·기사 속 뉴스레터·구장정보)와 뉴스레터의 모든 장소 링크는 이 화면 하나로 옴: place.html?n=이름&lat=위도&lng=경도&id=네이버장소번호
   길안내 코드는 이 파일에만 있음. 도착지 = 장소, 출발 = 현재 위치, 이동수단 = 자동차.
   1) 카톡 안 브라우저: 여기서 지도 앱을 열면 장소가 빠지므로, 먼저 휴대폰 기본 인터넷 앱으로 이 화면을 다시 엶(kakaotalk://web/openExternal, ext=1)
   2) 좌표가 없으면 회원 서버(geo)로 이름·주소의 좌표를 찾음
   3) 휴대폰: 네이버 지도 앱 nmap://route/car / 카카오맵 앱 kakaomap://route?by=CAR (안드로이드는 intent://). 앱이 없으면 모바일 웹 자동차 길찾기
   4) 컴퓨터(지도 앱 없음): 브라우저 현재 위치 -> 네이버 지도 / 카카오맵 웹 자동차 길찾기. 위치를 못 받으면 도착지만 채운 길찾기
   5) 처음 고른 지도(pgn_mapPick)를 기억해 다음부터 바로 그 지도로. 주소에 pick=1 이 있거나 '뒤로'로 돌아오면 다시 고름 */
(function(){
  var GEO='https://script.google.com/macros/s/AKfycby4zEPx3AB25E7x4peqc9UTlYsGgywDjew64Xh8Va7VhM4zMG8clQGM0eCUZIQqsW2tVg/exec';
  var q=new URLSearchParams(location.search), ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var android=/Android/i.test(ua), phone=ios||android||/Mobile/i.test(ua), inKakao=phone&&/KAKAOTALK/i.test(ua);
  var P={n:(q.get('n')||'').trim()||'장소', lat:parseFloat(q.get('lat')), lng:parseFloat(q.get('lng')), id:q.get('id')||''};
  var NM={naver:'네이버 지도',kakao:'카카오맵'}, APPNAME='parkgolfnews.org';
  function $(i){return document.getElementById(i);}
  function msg(h){$('msg').innerHTML=h||'';$('msg').style.display=h?'':'none';}
  function has(){return isFinite(P.lat)&&isFinite(P.lng);}
  function en(){return encodeURIComponent(P.n.replace(/[,\/;^|]/g,' '));}
  function getPref(){try{var v=localStorage.getItem('pgn_mapPick');return (v==='naver'||v==='kakao')?v:'';}catch(e){return '';}}
  function setPref(k){try{localStorage.setItem('pgn_mapPick',k);}catch(e){}}
  function self(extra){var u=new URLSearchParams(location.search);for(var k in extra)u.set(k,extra[k]);return location.origin+location.pathname+'?'+u.toString();}
  $('nm').textContent=P.n;

  /* ---- 주소 만들기 ---- */
  function appUrl(kind){
    var scheme,pkg,path;
    if(kind==='kakao'){scheme='kakaomap';pkg='net.daum.android.map';path=has()?('route?ep='+P.lat+','+P.lng+'&by=CAR'):('search?q='+en());}
    else{scheme='nmap';pkg='com.nhn.android.nmap';path=has()?('route/car?dlat='+P.lat+'&dlng='+P.lng+'&dname='+en()+'&appname='+APPNAME):('search?query='+en()+'&appname='+APPNAME);}
    if(android)return 'intent://'+path+'#Intent;scheme='+scheme+';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package='+pkg+';S.browser_fallback_url='+encodeURIComponent(mobileWeb(kind))+';end';
    return scheme+'://'+path;
  }
  function wcong(la,lo){
    var d=Math.PI/180,aW=6378137,fW=1/298.257223563,e2W=fW*(2-fW),p=la*d,l=lo*d,N=aW/Math.sqrt(1-e2W*Math.pow(Math.sin(p),2));
    var X=N*Math.cos(p)*Math.cos(l),Y=N*Math.cos(p)*Math.sin(l),Z=N*(1-e2W)*Math.sin(p),sec=Math.PI/648000,s=1+6.43e-6;
    var rx=1.16*sec,ry=-2.31*sec,rz=-1.63*sec; X=(X+115.80)/s; Y=(Y-474.99)/s; Z=(Z-674.11)/s;
    var Xb=X+rz*Y-ry*Z,Yb=-rz*X+Y+rx*Z,Zb=ry*X-rx*Y+Z;
    var aB=6377397.155,fB=1/299.1528128,e2=fB*(2-fB),lon=Math.atan2(Yb,Xb),pp=Math.sqrt(Xb*Xb+Yb*Yb),lt=Math.atan2(Zb,pp*(1-e2));
    for(var i=0;i<8;i++){var Nb=aB/Math.sqrt(1-e2*Math.pow(Math.sin(lt),2));lt=Math.atan2(Zb,pp*(1-e2*Nb/(Nb+(pp/Math.cos(lt)-Nb))));}
    var ep=e2/(1-e2);
    function M(f){return aB*((1-e2/4-3*e2*e2/64-5*Math.pow(e2,3)/256)*f-(3*e2/8+3*e2*e2/32+45*Math.pow(e2,3)/1024)*Math.sin(2*f)+(15*e2*e2/256+45*Math.pow(e2,3)/1024)*Math.sin(4*f)-(35*Math.pow(e2,3)/3072)*Math.sin(6*f));}
    var Nn=aB/Math.sqrt(1-e2*Math.pow(Math.sin(lt),2)),T=Math.pow(Math.tan(lt),2),C=ep*Math.pow(Math.cos(lt),2),A=(lon-127*d)*Math.cos(lt);
    var x=200000+Nn*(A+(1-T+C)*Math.pow(A,3)/6+(5-18*T+T*T+72*C-58*ep)*Math.pow(A,5)/120);
    var y=500000+(M(lt)-M(38*d)+Nn*Math.tan(lt)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*ep)*Math.pow(A,6)/720));
    return [Math.round(x*2.5-472),Math.round(y*2.5+766)];
  }
  function kx(v){v=String(v);var t='432101234',r='';for(var i=0;i<v.length;i++)r+=String.fromCharCode((t.charCodeAt(i%t.length)-48^v.charCodeAt(i)-48)+28+48);return r;}
  function mobileWeb(kind){
    if(kind==='kakao'){
      if(!has())return 'https://m.map.kakao.com/actions/searchView?q='+en();
      var w=wcong(P.lat,P.lng);return 'https://m.map.kakao.com/actions/routeView?exEnc='+encodeURIComponent(kx(w[0]))+'&eyEnc='+encodeURIComponent(kx(w[1]))+'&endLoc='+en();
    }
    if(!has())return 'https://m.search.naver.com/search.naver?query='+en();
    var cn=P.n.replace(/[;^|]/g,' ');
    return 'https://m.search.naver.com/search.naver?query='+encodeURIComponent('빠른길찾기')+'&nso_path='+encodeURIComponent('placeType^place;name^;address^;code^;longitude^;latitude^|type^place;name^'+cn+';address^;code^;longitude^'+P.lng+';latitude^'+P.lat+'|objtype^path;by^car');
  }
  function merc(la,lo){return [lo*20037508.34/180, Math.log(Math.tan((90+la)*Math.PI/360))/(Math.PI/180)*20037508.34/180];}
  function pcUrl(kind,me){
    var ME=encodeURIComponent('내 위치');
    if(!has())return kind==='kakao'?('https://map.kakao.com/link/search/'+en()):('https://map.naver.com/p/search/'+en());
    if(kind==='kakao')return me?('https://map.kakao.com/link/by/car/'+ME+','+me.lat+','+me.lng+'/'+en()+','+P.lat+','+P.lng):('https://map.kakao.com/link/to/'+en()+','+P.lat+','+P.lng);
    var d=merc(P.lat,P.lng), s=me?merc(me.lat,me.lng):null;
    return 'https://map.naver.com/p/directions/'+(s?(s[0]+','+s[1]+','+ME+',,'):'-')+'/'+d[0]+','+d[1]+','+en()+','+(P.id?(P.id+',PLACE_POI'):',')+'/-/car';
  }

  /* ---- 컴퓨터: 현재 위치 ---- */
  function myPos(cb){
    var done=false; function fin(p){if(!done){done=true;cb(p);}}
    try{var c=JSON.parse(localStorage.getItem('pgn_pos')||'null');if(c&&Date.now()-c.t<600000)return fin(c);}catch(e){}
    if(!navigator.geolocation)return fin(null);
    function ok(g){var p={lat:+g.coords.latitude.toFixed(6),lng:+g.coords.longitude.toFixed(6),t:Date.now()};try{localStorage.setItem('pgn_pos',JSON.stringify(p));}catch(e){}fin(p);}
    function ask(ms){setTimeout(function(){fin(null);},ms);navigator.geolocation.getCurrentPosition(ok,function(){fin(null);},{timeout:ms-500,maximumAge:600000});}
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(s){
        if(s.state==='denied'){msg('이 브라우저에서 위치 정보가 차단돼 있어 출발지를 채우지 못했습니다. 주소창 왼쪽 아이콘 → 위치 → <b>허용</b>으로 바꾸면 다음부터 내 위치에서 출발하는 경로가 나옵니다.');return setTimeout(function(){fin(null);},2500);}
        if(s.state==='prompt')msg('브라우저 위쪽에 뜬 창에서 <b>위치 정보 허용</b>을 눌러 주세요. 지금 계신 곳에서 출발하는 자동차 경로를 엽니다.');
        ask(s.state==='prompt'?30000:8000);
      },function(){ask(10000);});
    }else ask(10000);
  }

  /* ---- 길안내 시작 ---- */
  function go(kind,tap){
    setPref(kind);
    if(inKakao){   // 카톡 안: 기본 인터넷 앱으로 넘겨서 엶. 안 넘어가면 카톡 안에서 웹 길찾기
      var left=false; document.addEventListener('visibilitychange',function(){if(document.hidden)left=true;});
      location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(self({ext:'1',go:kind}));
      setTimeout(function(){if(!left&&!document.hidden)location.href=mobileWeb(kind);},1500);
      return;
    }
    if(phone){
      var gone=false; function g(){gone=true;}
      document.addEventListener('visibilitychange',function(){if(document.hidden)g();});
      window.addEventListener('pagehide',g); window.addEventListener('blur',g);
      msg('<b>'+NM[kind]+'</b> 앱을 여는 중입니다…');
      location.href=appUrl(kind);
      setTimeout(function(){
        if(gone||document.hidden){msg('');return;}
        if(tap)location.href=mobileWeb(kind);   // 눌렀는데도 앱이 안 열림 = 앱 없음 -> 웹 자동차 길찾기
        else msg('아래 <b>'+(kind==='kakao'?'카카오맵으로':'네이버 지도로')+' 길안내</b> 버튼을 누르면 이 장소까지 자동차 길안내가 시작됩니다.');
      },2500);
      return;
    }
    msg('지금 계신 곳을 확인하고 <b>'+NM[kind]+'</b> 자동차 길찾기를 엽니다…');
    if(!has()){location.href=pcUrl(kind,null);return;}
    myPos(function(me){location.href=pcUrl(kind,me);});
  }

  /* ---- 화면 ---- */
  function render(){
    document.title=P.n+' 길안내 · 파크골프뉴스';
    $('nm').textContent=P.n;
    $('bN').href=phone?mobileWeb('naver'):pcUrl('naver',null);
    $('bK').href=phone?mobileWeb('kakao'):pcUrl('kakao',null);
    $('bN').onclick=function(e){e.preventDefault();go('naver',true);};
    $('bK').onclick=function(e){e.preventDefault();go('kakao',true);};
    $('note').textContent=(phone
      ?'버튼을 누르면 네이버 지도 앱 또는 카카오맵 앱이 열리고, 출발 = 내 위치, 도착 = 이 장소, 자동차 경로가 나옵니다. 앱이 없으면 웹 길찾기가 열립니다. 처음 고른 지도는 기억해 다음부터 바로 엽니다.'
      :'버튼을 누르면 지금 계신 곳에서 이 장소까지 자동차 경로가 열립니다(컴퓨터에는 지도 앱이 없어 웹 지도로 엽니다). 처음 한 번 브라우저가 위치 정보를 물으면 \'허용\'을 눌러 주세요. 처음 고른 지도는 기억해 다음부터 바로 엽니다.')
      +(has()?' 지도 바탕: OpenStreetMap(ODbL), https://www.openstreetmap.org/copyright':' 이 장소의 정확한 위치를 찾지 못해 이름으로 검색한 화면이 열립니다.');
    if(has())drawMap();
    var nt='';try{var ne=performance.getEntriesByType('navigation')[0];nt=ne?ne.type:'';}catch(e){}
    var want=q.get('go')||getPref();
    if((want==='naver'||want==='kakao')&&q.get('pick')!=='1'&&nt!=='back_forward'){go(want,false);}
    else msg(getPref()?('지난번에 고른 지도: <b>'+NM[getPref()]+'</b> · 다른 지도를 누르면 다음부터 그 지도로 바로 안내합니다.'):'처음 한 번만 지도를 고르시면 다음부터는 묻지 않고 바로 길안내를 엽니다.');
  }
  window.addEventListener('pageshow',function(e){if(e.persisted)msg(getPref()?('다른 지도로 보려면 아래 버튼을 누르세요.'):'');});
  function drawMap(){
    var z=16,N=Math.pow(2,z),r=P.lat*Math.PI/180,fx=(P.lng+180)/360*N,fy=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*N,tx=Math.floor(fx),ty=Math.floor(fy),t=$('tiles');
    $('map').style.display='';t.innerHTML='';
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var im=new Image();im.alt='';im.src='https://tile.openstreetmap.org/'+z+'/'+(tx+dx)+'/'+(ty+dy)+'.png';im.style.left=((dx+1)*256)+'px';im.style.top=((dy+1)*256)+'px';t.appendChild(im);}
    function pos(){var m=$('map');t.style.left=(m.clientWidth/2-(256+(fx-tx)*256))+'px';t.style.top=(m.clientHeight/2-(256+(fy-ty)*256))+'px';}
    pos();window.addEventListener('resize',pos);
  }
  function lookup(cb){   // 좌표 찾기 (회원 서버 geo: 장소 이름·주소 -> 위도·경도)
    var done=false;function fin(){if(!done){done=true;cb();}}
    msg('장소 위치를 찾는 중입니다…');setTimeout(fin,4500);
    fetch(GEO,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'geo',q:P.n})})
      .then(function(r){return r.json();}).then(function(j){
        if(!done&&j&&j.ok&&!j.none&&isFinite(j.lat)&&isFinite(j.lng)){P.lat=+j.lat;P.lng=+j.lng;if(j.n&&/파크골프|구장|공원|체육/.test(j.n))P.n=j.n;if(j.addr)$('addr').textContent=j.addr;}
        fin();
      }).catch(fin);
  }
  function start(){ if(has())render(); else lookup(render); }

  /* ---- 1) 카톡 안이면 먼저 기본 인터넷 앱으로 ---- */
  if(inKakao&&q.get('ext')!=='1'){
    var left=false; document.addEventListener('visibilitychange',function(){if(document.hidden)left=true;});
    msg('휴대폰 인터넷 앱에서 길안내를 엽니다…');
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(self({ext:'1'}));
    setTimeout(function(){ if(left||document.hidden){ q.set('pick','1'); } start(); },1500);   // 넘어갔으면 이 화면은 고르기만(자동 이동 없음)
    return;
  }
  start();
})();
</script>
<script src="/assets/nlwin.js?v=20261116n"></script>
</body>
</html>
