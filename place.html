<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장소 보기 · 파크골프뉴스</title>
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;background:#F7F3EA;color:#14342A;-webkit-text-size-adjust:100%}
.top{background:#14342A;color:#F0D9A6;padding:14px 18px;font-size:14px;font-weight:700;letter-spacing:.02em}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;line-height:1.35;margin:4px 0 12px}
.map{position:relative;width:100%;height:260px;overflow:hidden;border-radius:14px;background:#e6e2d8;border:1px solid #d9d2c3}
.tiles{position:absolute;left:0;top:0;width:768px;height:768px}
.tiles img{position:absolute;width:256px;height:256px;display:block}
.pin{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-28px 0 0 -14px;border-radius:50% 50% 50% 0;background:#B5543C;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin::after{content:'';position:absolute;left:9px;top:9px;width:10px;height:10px;border-radius:50%;background:#fff}
.attr{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:4px;color:#333}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:10px;border-radius:12px;font-size:17px;font-weight:700;text-decoration:none}
.b1{background:#03C75A;color:#fff}
.b2{background:#FEE500;color:#191919}
.b3{background:#fff;color:#14342A;border:1px solid #cfc7b6}
.pick{font-size:14px;color:#14342A;line-height:1.55;margin-top:12px;background:#fff;border:1px solid #e3dccd;border-radius:10px;padding:10px 12px}
.pick b{color:#B5543C}
body.going .btn{opacity:.45}
.note{font-size:12.5px;color:#5b6b63;line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div class="top">PARKGOLF NEWS · 장소 보기</div>
<div class="wrap">
  <h1 id="nm">장소</h1>
  <div class="map" id="map"><div class="tiles" id="tiles"></div><div class="pin"></div><div class="attr">© OpenStreetMap contributors</div></div>
  <a class="btn b1" id="nav">네이버 지도에서 보기</a>
  <a class="btn b2" id="kko">카카오맵으로 보기</a>
  <p class="pick" id="pick"></p>
  <p class="note">네이버 지도에서 이 장소에 핀이 꽂힌 지도가 열립니다. 네이버 지도 앱으로 보려면 열린 화면 아래의 '지도앱으로 보기'를 누르세요. 지도 바탕: OpenStreetMap(ODbL), https://www.openstreetmap.org/copyright</p>
</div>
<script src="/assets/mapapp.js?v=20261115a"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  /* 2026-11-15 사용자 "뉴스기사안의 장소도 네이버지도와 카카오지도에 연결되게": 기사 본문 장소 링크는 이름만 있음(?n=이름).
     좌표가 없으면 회원 서버 geo(카카오 로컬 검색)로 좌표를 받아 주소에 붙여 다시 엶 (g=1: 한 번만). 못 찾으면 이름 검색으로 안내. */
  if(isNaN(parseFloat(q.get('lat')))&&q.get('n')&&!q.get('g')){
    var done=false, go=function(){ if(done)return; done=true; run(); };
    try{ document.getElementById('nm').textContent=q.get('n'); document.getElementById('pick').textContent='위치를 찾는 중입니다…'; }catch(e){}
    setTimeout(go,4500);
    fetch('https://script.google.com/macros/s/AKfycby4zEPx3AB25E7x4peqc9UTlYsGgywDjew64Xh8Va7VhM4zMG8clQGM0eCUZIQqsW2tVg/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'geo',q:q.get('n')})})
      .then(function(r){return r.json();}).then(function(j){
        if(done)return;
        if(j&&j.ok&&!j.none&&isFinite(j.lat)&&isFinite(j.lng)){ done=true; q.set('lat',j.lat); q.set('lng',j.lng); if(j.n)q.set('n',j.n); q.set('g','1'); location.replace(location.pathname+'?'+q.toString()+location.hash); }
        else go();
      }).catch(go);
    return;
  }
  run();
  function run(){
  var n=q.get('n')||'장소', lat=parseFloat(q.get('lat')), lng=parseFloat(q.get('lng')), id=q.get('id')||'';
  document.getElementById('nm').textContent=n; document.title=n+' · 파크골프뉴스';
  var en=encodeURIComponent(n), app='org.parkgolfnews';
  /* 2026-11-07: 어디서 눌러도 반드시 이동하도록 고침 (PC·카톡 안 브라우저·앱 없는 폰에서 앱 주소만 쓰면 아무 일도 안 일어남)
     - PC: 네이버 지도 웹으로 바로 이동
     - 휴대폰: 네이버 지도 앱을 먼저 열어 보고, 1.5초 안에 앱이 안 열리면 네이버 지도 웹(모바일)으로 이동 */
  /* 2026-11-13: 휴대폰에서 '네이버 지도 앱으로 보기'를 누르면 앱이 구장 대신 현재 위치만 보이는 일이 계속됨(11/1·11/7·11/13 재발, 카톡 안 브라우저에서 앱으로 넘길 때 장소 정보가 빠짐)
     -> 앱으로 넘기는 주소(nmap://, intent://, map.naver.com/p/…)를 아예 쓰지 않고, 구장 자리에 핀이 꽂히는 네이버 지도 웹 화면으로 바로 엶.
        앱으로 보고 싶으면 열린 네이버 화면 아래의 '지도앱으로 보기'(네이버가 만든 버튼)를 누르면 됨.
     - 휴대폰: 장소 번호 있으면 m.place.naver.com/place/번호/location (지도 탭, 핀), 없으면 m.map.naver.com/map?lat&lng (좌표 핀), 둘 다 없으면 모바일 웹 검색
     - PC: map.naver.com/p/entry/place/번호 또는 map.naver.com/p/search/위도,경도 */
  var ua=navigator.userAgent||'', mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var hasLL=!isNaN(lat)&&!isNaN(lng);
  var mWeb=id?('https://m.place.naver.com/place/'+id+'/location'):(hasLL?('https://m.map.naver.com/map?lat='+lat+'&lng='+lng+'&dlevel=12&pinTitle='+en+'&pinType=site'):('https://m.search.naver.com/search.naver?query='+en));
  var pcWeb=id?('https://map.naver.com/p/entry/place/'+id):(hasLL?('https://map.naver.com/p/search/'+lat+','+lng):('https://map.naver.com/p/search/'+en));
  var nav=document.getElementById('nav');
  nav.textContent='네이버 지도에서 보기'; nav.href=mobile?mWeb:pcWeb;
  /* 2026-11-15 사용자 지시 "휴대폰에서 뉴스레터의 장소를 누르면 네이버지도가 현위치만 나오는데 그 자동차경로가 나오게 바꿔줘":
     휴대폰은 네이버 '빠른길찾기'(m.search.naver.com, 출발 = 내 위치, 도착 = 구장 좌표, 자동차) 웹 화면으로 바로 엶. 경로와 '안내시작' 버튼이 바로 보임.
     주소 형식은 네이버가 m.map.naver.com/route.nhn?ename&ex&ey&pathType=0 을 넘겨 보내는 화면과 같음. 앱으로 넘기는 주소는 쓰지 않음. */
  if(mobile&&hasLL){
    var cn=n.replace(/[;^|]/g,' ');
    nav.href='https://m.search.naver.com/search.naver?query='+encodeURIComponent('빠른길찾기')+'&nso_path='+encodeURIComponent('placeType^place;name^;address^;code^;longitude^;latitude^|type^place;name^'+cn+';address^;code^;longitude^'+lng+';latitude^'+lat+'|objtype^path;by^car');
    nav.textContent='네이버 지도 자동차 길찾기';
  }
  /* 2026-11-15 사용자 지시 "휴대폰에서 뉴스레터를 열고 장소를 누르면 네비게이션이 현재위치만 나오게 해 이거 해결해줘":
     휴대폰에서 map.kakao.com/link/map/… 은 m.map.kakao.com/?urlX… 첫 화면으로 넘어가 구장 대신 기본 위치만 보이고, '앱으로 보기'를 누르면 앱이 장소 없이(현재 위치) 열림.
     -> 휴대폰은 카카오맵 모바일 웹 길찾기 화면(도착지 = 구장 좌표, 이름 표시)으로 바로 엶. 앱으로 넘기는 주소는 쓰지 않음.
        좌표 변환: WGS84 -> 카카오 WCONGNAMUL(Bessel TM 중부원점 x2.5, 카카오 link/map 결과와 비교해 보정, 오차 약 4m 이내), exEnc/eyEnc 는 카카오 모바일 지도와 같은 방식으로 인코딩. */
  function wcong(la,lo){
    var d=Math.PI/180,aW=6378137,fW=1/298.257223563,e2W=fW*(2-fW),p=la*d,l=lo*d,N=aW/Math.sqrt(1-e2W*Math.pow(Math.sin(p),2));
    var X=N*Math.cos(p)*Math.cos(l),Y=N*Math.cos(p)*Math.sin(l),Z=N*(1-e2W)*Math.sin(p),sec=Math.PI/648000,s=1+6.43e-6;
    var rx=1.16*sec,ry=-2.31*sec,rz=-1.63*sec; X=(X+115.80)/s; Y=(Y-474.99)/s; Z=(Z-674.11)/s;
    var Xb=X+rz*Y-ry*Z,Yb=-rz*X+Y+rx*Z,Zb=ry*X-rx*Y+Z;
    var aB=6377397.155,fB=1/299.1528128,e2=fB*(2-fB),lon=Math.atan2(Yb,Xb),pp=Math.sqrt(Xb*Xb+Yb*Yb),lt=Math.atan2(Zb,pp*(1-e2));
    for(var i=0;i<8;i++){var Nb=aB/Math.sqrt(1-e2*Math.pow(Math.sin(lt),2));lt=Math.atan2(Zb,pp*(1-e2*Nb/(Nb+(pp/Math.cos(lt)-Nb))));}
    var ep=e2/(1-e2);
    function M(f){return aB*((1-e2/4-3*e2*e2/64-5*Math.pow(e2,3)/256)*f-(3*e2/8+3*e2*e2/32+45*Math.pow(e2,3)/1024)*Math.sin(2*f)+(15*e2*e2/256+45*Math.pow(e2,3)/1024)*Math.sin(4*f)-(35*Math.pow(e2,3)/3072)*Math.sin(6*f));}
    var Nn=aB/Math.sqrt(1-e2*Math.pow(Math.sin(lt),2)),T=Math.pow(Math.tan(lt),2),C=ep*Math.pow(Math.cos(lt),2),A=(lon-127*d)*Math.cos(lt);
    var x=200000+Nn*(A+(1-T+C)*Math.pow(A,3)/6+(5-18*T+T*T+72*C-58*ep)*Math.pow(A,5)/120);
    var y=500000+(M(lt)-M(38*d)+Nn*Math.tan(lt)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*ep)*Math.pow(A,6)/720));
    return [Math.round(x*2.5-472),Math.round(y*2.5+766)];
  }
  function kx(v){v=String(v);var t='432101234',r='';for(var i=0;i<v.length;i++)r+=String.fromCharCode((t.charCodeAt(i%t.length)-48^v.charCodeAt(i)-48)+28+48);return r;}
  var kko=document.getElementById('kko'), hasXY=!isNaN(lat)&&!isNaN(lng);
  if(mobile&&hasXY){kko.textContent='카카오맵 길찾기';var wc=wcong(lat,lng);kko.href='https://m.map.kakao.com/actions/routeView?exEnc='+encodeURIComponent(kx(wc[0]))+'&eyEnc='+encodeURIComponent(kx(wc[1]))+'&endLoc='+en;}
  else if(mobile)kko.href='https://m.map.kakao.com/actions/searchView?q='+en;
  else kko.href=hasXY?('https://map.kakao.com/link/map/'+en+','+lat+','+lng):('https://map.kakao.com/link/search/'+en);
  /* 2026-11-15 사용자 지시 "휴대폰에서 네이버 빠른길찾기로 이동하는데 실시간추천의 안내시작을 누르면 현위치만 나옴":
     빠른길찾기의 '안내시작'은 m.map.naver.com/appLink.naver(도착지 dlat·dlng·dname 포함)로 네이버 지도 앱을 여는데,
     카톡 안 브라우저에서는 앱으로 넘어갈 때 이 정보가 빠져 앱이 현재 위치만 보임(11/1·11/7·11/13 앱 버튼도 같은 이유로 실패).
     -> 카톡 안에서 지도 버튼을 누르면 길찾기 화면을 휴대폰 기본 인터넷 앱(크롬·삼성 인터넷·사파리)으로 열어(kakaotalk://web/openExternal),
        그 화면의 '안내시작'이 도착지(구장)를 앱에 그대로 넘기게 함. 1.5초 안에 바깥 브라우저가 안 열리면 지금 창에서 그대로 엶. */
  var inKakao=mobile&&/KAKAOTALK/i.test(ua);
  function go(u){
    if(!inKakao){location.href=u;return;}
    var t=setTimeout(function(){if(!document.hidden)location.href=u;},1500);
    document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(t);});
    location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);
  }
  /* 2026-11-15 사용자 지시 "주소를 찾을 때 네이버를 선택하든 카카오를 선택하든 한번 정하면 다시 물어보지 말고 그대로 안내":
     처음 누른 지도(네이버/카카오)를 이 기기에 기억(localStorage pgn_mapPick)하고, 다음부터는 묻지 않고 그 지도로 바로 이동.
     지도에서 '뒤로'로 돌아오면 다시 고를 수 있게 버튼을 보여 줌(누른 지도로 기억이 바뀜). 주소 끝에 ?pick=1 이어도 고르는 화면. */
  var PK='pgn_mapPick', pref=''; try{pref=localStorage.getItem(PK)||'';}catch(e){}
  if(pref!=='naver'&&pref!=='kakao')pref='';
  function save(v){try{localStorage.setItem(PK,v);}catch(e){}}
  /* 2026-11-15 사용자 지시 "네이버지도와 카카오지도로 직접 연결하게 해줘", "자동차로 설정하게 해주고":
     휴대폰에서 버튼을 누르면 네이버 지도 앱 / 카카오맵 앱을 바로 열어 도착지 = 구장, 출발 = 내 위치, 자동차 길찾기를 띄움(assets/mapapp.js).
     앱이 2초 안에 안 열리면(앱 미설치 등) 지금까지처럼 웹 자동차 길찾기 화면을 엶. */
  var APP=!!(mobile&&window.pgnMapApp);
  function appGo(kind,el,onFail){pgnMapApp.open(kind,n,lat,lng,onFail||function(){go(el.href);},el.href);}
  if(APP){nav.textContent='네이버 지도 앱 자동차 길안내';kko.textContent='카카오맵 앱 자동차 길안내';}
  nav.addEventListener('click',function(e){save('naver');if(APP){e.preventDefault();appGo('naver',nav);}else if(inKakao){e.preventDefault();go(nav.href);}});
  kko.addEventListener('click',function(e){save('kakao');if(APP){e.preventDefault();appGo('kakao',kko);}else if(inKakao){e.preventDefault();go(kko.href);}});
  var pk=document.getElementById('pick'), NM={naver:'네이버 지도',kakao:'카카오맵'};
  function chooser(){
    pk.innerHTML=pref?('지난번에 고른 지도: <b>'+NM[pref]+'</b> · 다른 지도를 누르면 다음부터는 그 지도로 바로 안내합니다.'):'처음 한 번만 고르시면 다음부터는 묻지 않고 고른 지도로 바로 안내합니다.';
    document.body.classList.remove('going');
  }
  var nt=''; try{var ne=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]; nt=ne?ne.type:'';}catch(e){}
  if(pref&&q.get('pick')!=='1'&&nt!=='back_forward'){
    pk.innerHTML='<b>'+NM[pref]+'</b>로 바로 안내합니다…';
    document.body.classList.add('going');
    if(APP)appGo(pref,pref==='kakao'?kko:nav,function(){pk.innerHTML='<b>'+NM[pref]+' 앱</b>이 열리지 않으면 아래 버튼을 눌러 주세요.';document.body.classList.remove('going');});
    else go((pref==='kakao')?kko.href:nav.href);
  } else chooser();
  window.addEventListener('pageshow',function(e){if(e.persisted)chooser();});
  if(mobile){var nt0=document.querySelector('.note');if(nt0)nt0.textContent='누르면 네이버 지도 앱 또는 카카오맵 앱이 바로 열리고, 도착지가 이 구장, 출발이 내 위치, 이동수단이 자동차로 잡힌 길찾기가 나옵니다. 앱의 \'안내시작\'을 누르면 길안내가 시작됩니다. 앱이 없으면 웹 길찾기 화면이 열립니다. 지도 바탕: OpenStreetMap(ODbL), https://www.openstreetmap.org/copyright';}
  if(isNaN(lat)||isNaN(lng)){var nt1=document.querySelector('.note');if(nt1)nt1.textContent='이 장소의 정확한 위치를 찾지 못해 이름으로 검색한 화면이 열립니다. 검색 결과에서 장소를 골라 주세요.';document.getElementById('map').style.display='none';return;}
  var z=16, N=Math.pow(2,z), r=lat*Math.PI/180;
  var fx=(lng+180)/360*N, fy=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*N;
  var tx=Math.floor(fx), ty=Math.floor(fy), tiles=document.getElementById('tiles');
  for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var im=new Image();im.alt='';im.src='https://tile.openstreetmap.org/'+z+'/'+(tx+dx)+'/'+(ty+dy)+'.png';im.style.left=((dx+1)*256)+'px';im.style.top=((dy+1)*256)+'px';tiles.appendChild(im);}
  function place(){var m=document.getElementById('map');var px=256+(fx-tx)*256, py=256+(fy-ty)*256;tiles.style.left=(m.clientWidth/2-px)+'px';tiles.style.top=(m.clientHeight/2-py)+'px';}
  place(); window.addEventListener('resize',place);
  }
})();
</script>
<script src="/assets/nlwin.js?v=20261115a"></script>
</body>
</html>
