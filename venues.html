<body>
<div class="wrap">
  <main class="vn">
    <h2 class="sec">구장정보</h2>
    <nav class="vn-tabs" aria-label="지역"><a href="venues.html" class="on">대전 1시간 거리</a></nav>
    <iframe class="vn-frame" id="vnF" title="대전광역시에서 1시간 거리의 파크골프장" src="assets/venue_daejeon.html?v=20261114b" scrolling="no"></iframe>

<script src="assets/app.js?v=20261113i"></script>
<script>
/* 구장정보 (2026-11-13, 사용자 "홈페이지에 구장정보라는 메뉴를 만들어서 … daejeon.html 이거 올려줘")
   - 지역별 구장 목록 페이지(assets/venue_*.html)를 같은 사이트 안에서 보여 줌. 높이는 내용에 맞춰 자동으로 늘어남 */
(async () => {
  layout('venues');
  const f = document.getElementById('vnF');
  const fit = () => { try { const d = f.contentDocument; if (!d || !d.documentElement) return; f.style.height = '0px'; f.style.height = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0) + 'px'; } catch (e) {} };
  let inited = null;
  const init = () => {
    fit();
    try { const d = f.contentDocument; if (inited !== d) { inited = d; new ResizeObserver(fit).observe(d.body); d.addEventListener('click', () => setTimeout(fit, 50)); } } catch (e) {}
    setTimeout(fit, 400); setTimeout(fit, 1500); setTimeout(fit, 4000);
  };
  f.addEventListener('load', init);
  /* 휴대폰에서 iframe이 스크립트보다 먼저 다 열리면 load를 놓쳐 높이가 600px에 멈추던 문제 (2026-11-14) */
  try { const d0 = f.contentDocument; if (d0 && d0.readyState === 'complete' && d0.body && d0.body.childElementCount) init(); } catch (e) {}
  addEventListener('resize', fit);
})();
</script>
