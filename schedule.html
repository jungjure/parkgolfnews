<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대회일정 - 파크골프뉴스</title>
<meta name="description" content="전국 파크골프 대회 일정과 접수 기간, 연습일 일정을 한눈에 확인하세요.">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261009j">
<style>#chips button.tag{border:2px solid transparent;cursor:pointer;font-family:inherit;line-height:inherit}#chips button.tag.on{border-color:currentColor}#chips.f button.tag:not(.on){opacity:.4}</style>
</head>
<body>
<div class="wrap cols">
  <main style="width:100%;max-width:869px;margin:0 auto">
    <h2 class="sec">대회일정</h2>
    <div class="monthnav"><button id="prev">&lsaquo;</button><span id="ml"></span><button id="next">&rsaquo;</button><button id="now" style="font-size:.9rem;font-weight:700">이번 달</button></div>
    <div class="sumline" id="chips"></div>
    <div class="toolbar"><input type="search" id="q" placeholder="대회명·지역 검색"></div>
    <div class="card" id="list"><div class="loading">불러오는 중...</div></div>
  </main>
  <div id="side"></div>
</div>
<script src="assets/app.js?v=20261009j"></script>
<script>
(async () => {
  const S = await layout('schedule');
  $('#side').innerHTML = sideBox(S);
  let all = [], type = new URLSearchParams(location.search).get('type') || '전체', q = '';
  const t = today0(); let y = t.getFullYear(), m = t.getMonth();
  const kind = e => isTrial(e) ? '시범운영' : e.type;
  const draw = () => {
    $('#ml').textContent = `${y}년 ${m + 1}월`;
    const first = (y === t.getFullYear() && m === t.getMonth()) ? new Date(t) : new Date(y, m, 1), last = new Date(y, m + 1, 0);   /* 이번 달은 지나간 날을 빼고 오늘부터 보여줌 */
    const mon = all.filter(e => e.end >= first && e.start <= last && (!q || (e.name + e.region + e.place).includes(q)));
    /* 오늘일정처럼 "대회 N건 · 접수 N건 · 연습일 N건 · 시범운영 N건" (누르면 그 구분만 보기, 다시 누르면 전체) */
    const cnt = {}; mon.forEach(e => { const k = kind(e); cnt[k] = (cnt[k] || 0) + 1; });
    const ord = ['대회', '접수', '연습일'], keys = Object.keys(cnt).sort((a, b) => (a === '시범운영') - (b === '시범운영') || ((ord.indexOf(a) + 1 || 9) - (ord.indexOf(b) + 1 || 9)));
    if (type !== '전체' && !cnt[type]) type = '전체';
    $('#chips').classList.toggle('f', type !== '전체');
    $('#chips').innerHTML = keys.map(k => '<button type="button" class="tag ' + esc(k) + (k === type ? ' on' : '') + '" data-c="' + esc(k) + '" title="' + esc(k) + '만 보기">' + esc(k) + ' ' + cnt[k] + '건</button>').join('');
    const f = mon.filter(e => type === '전체' || kind(e) === type);
    if (!f.length) { $('#list').innerHTML = '<div class="empty">이 달에 등록된 일정이 없습니다.</div>'; return; }
    /* 시작일 기준으로 묶기 (이번 달 이전에 시작한 일정은 1일로) */
    const groups = new Map();
    f.forEach(e => { const d = e.start < first ? first : e.start; const k = ymd(d); if (!groups.has(k)) groups.set(k, { d, items: [] }); groups.get(k).items.push(e); });
    $('#list').innerHTML = [...groups.values()].sort((a, b) => a.d - b.d).map(g =>
      `<div class="dayhead ${ymd(g.d) === ymd(t) ? 'today' : ''}">${g.d.getMonth() + 1}월 ${g.d.getDate()}일 (${WD[g.d.getDay()]})${ymd(g.d) === ymd(t) ? ' · 오늘' : ''}</div>` + g.items.map(e => eventRow(e)).join('')).join('');
  };
  const build = async first => {
    all = await getSchedule();
    if (first) {
    $('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; type = type === b.dataset.c ? '전체' : b.dataset.c; draw(); };
    $('#prev').onclick = () => { m--; if (m < 0) { m = 11; y--; } draw(); };
    $('#next').onclick = () => { m++; if (m > 11) { m = 0; y++; } draw(); };
    $('#now').onclick = () => { y = t.getFullYear(); m = t.getMonth(); draw(); };
    $('#q').oninput = e => { q = e.target.value.trim(); draw(); };
    }
    draw();
  };
  try {
    await build(true);
    addEventListener('pgn-data', () => { build(false).catch(() => {}); });
  } catch (e) { showError($('#list'), e); }
})();
</script>
</body>
</html>
