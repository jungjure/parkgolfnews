<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘일정 - 파크골프뉴스</title>
<meta name="description" content="오늘 열리는 전국 파크골프 대회, 접수 시작·마감, 연습라운딩 일정을 날짜별로 확인하세요.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap cols">
  <main style="width:100%;max-width:869px;margin:0 auto">
    <h2 class="sec">오늘일정</h2>
    <div class="daynav"><button id="prev">&lsaquo; 전날</button><span class="dl" id="dl"></span><button id="now" class="on">오늘</button><button id="next">다음날 &rsaquo;</button></div>
    <div class="sumline" id="sum"></div>
    <div class="card" id="list"><div class="loading">불러오는 중...</div></div>
    <section class="block" style="margin-top:34px"><h2 class="sec">접수 마감 임박 <a class="more" href="schedule.html?type=접수">접수 일정 &rarr;</a></h2>
      <div class="card" id="deadline"></div></section>
    <section class="block"><h2 class="sec">앞으로 7일 일정 <a class="more" href="schedule.html">전체 일정 &rarr;</a></h2>
      <div class="card" id="week"></div></section>
  </main>
  <div id="side"></div>
</div>
<script src="assets/app.js?v=20261004g"></script>
<script>
(async () => {
  const S = await layout('today');
  $('#side').innerHTML = sideBox(S);
  const t = today0(); let cur = new Date(t), all = [];
  const order = { '대회': 0, '접수': 1, '연습라운딩': 2 };
  const on = (e, d) => ymd(e.start) <= ymd(d) && ymd(e.end) >= ymd(d);
  const draw = () => {
    const k = ymd(cur), diff = Math.round((cur - t) / 864e5);
    $('#dl').textContent = cur.getFullYear() + '년 ' + (cur.getMonth() + 1) + '월 ' + cur.getDate() + '일 (' + WD[cur.getDay()] + ')' + (diff === 0 ? ' · 오늘' : diff === 1 ? ' · 내일' : diff === -1 ? ' · 어제' : '');
    $('#now').classList.toggle('on', diff === 0);
    const td = all.filter(e => on(e, cur)).sort((a, b) => (order[a.type] ?? 9) - (order[b.type] ?? 9) || a.start - b.start);
    const cnt = {}; td.forEach(e => cnt[e.type] = (cnt[e.type] || 0) + 1);
    $('#sum').innerHTML = td.length ? Object.entries(cnt).map(([k, v]) => '<span class="tag ' + esc(k) + '">' + esc(k) + ' ' + v + '건</span>').join('') : '';
    $('#list').innerHTML = td.length ? td.map(e => eventRow(e, { max: 20 })).join('') : '<div class="empty">이 날 등록된 일정이 없습니다.</div>';
  };
  try {
    all = await getSchedule();
    draw();
    $('#prev').onclick = () => { cur.setDate(cur.getDate() - 1); draw(); };
    $('#next').onclick = () => { cur.setDate(cur.getDate() + 1); draw(); };
    $('#now').onclick = () => { cur = new Date(t); draw(); };
    const tn = ymd(t);
    const dl = all.filter(e => e.type === '접수' && ymd(e.end) >= tn && (e.end - t) / 864e5 <= 7).sort((a, b) => a.end - b.end);
    $('#deadline').innerHTML = dl.length ? dl.map(e => eventRow(e, { max: 20 })).join('') : '<div class="empty">7일 안에 마감되는 접수가 없습니다.</div>';
    const end = new Date(t); end.setDate(end.getDate() + 7);
    const wk = all.filter(e => e.start > t && e.start <= end).sort((a, b) => a.start - b.start);
    const groups = new Map(); wk.forEach(e => { const k = ymd(e.start); if (!groups.has(k)) groups.set(k, { d: e.start, items: [] }); groups.get(k).items.push(e); });
    $('#week').innerHTML = wk.length ? [...groups.values()].map(g => '<div class="dayhead">' + (g.d.getMonth() + 1) + '월 ' + g.d.getDate() + '일 (' + WD[g.d.getDay()] + ')</div>' + g.items.map(e => eventRow(e, { max: 20 })).join('')).join('') : '<div class="empty">앞으로 7일 안에 시작하는 일정이 없습니다.</div>';
  } catch (e) { showError($('#list'), e); }
})();
</script>
</body>
</html>
