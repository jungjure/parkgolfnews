<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 알림 - 파크골프뉴스</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261011d">
<style>
.nt-help{margin:4px 0 14px;color:#555;line-height:1.6}
.nt-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.nt-tools button{border:2px solid var(--g700);background:#fff;color:var(--g900);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.95rem;cursor:pointer}
.nt-tools button.on{background:var(--g700);color:#fff}
.nt{display:block;border:1px solid #ddd;border-radius:12px;padding:12px 14px;margin:0 0 10px;background:#fff;color:inherit;text-decoration:none}
.nt:hover{border-color:var(--g700);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.nt.new{border:2px solid #e53935;background:#fff8f7}
.nt-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem}
.nt-k{border-radius:6px;padding:2px 8px;font-weight:800;color:#fff;background:var(--g700)}
.nt-k.j{background:#1565c0}
.nt-s{border-radius:6px;padding:2px 8px;font-weight:700;background:#eee;color:#333}
.nt-s.s1{background:#fff3cd;color:#8a6100}.nt-s.s2{background:#e3f4e8;color:#1b6b34}.nt-s.s3{background:#f1f1f1;color:#777}
.nt-new{color:#e53935;font-weight:800}
.nt-at{margin-left:auto;color:#888}
.nt-t{margin:6px 0 2px;font-weight:800;color:var(--g900);overflow-wrap:anywhere}
.nt-b{color:#333;line-height:1.55;overflow-wrap:anywhere}
.nt-b b{margin-right:6px}
.nt-empty{padding:30px 10px;text-align:center;color:#666;line-height:1.7}
</style>
</head>
<body>
<div class="wrap cols">
  <main class="article">
    <h2 class="sec">내 알림</h2>
    <p class="nt-help">내가 쓴 자유게시판·조인게시판 글에 달린 댓글과 조인 참가 신청을 모아 보여 드립니다. 항목을 누르면 그 글로 이동합니다. 참가 신청은 글에서 수락·거절할 수 있습니다.</p>
    <div class="nt-tools" id="ntf"></div>
    <div id="list"><div class="nt-empty">불러오는 중입니다...</div></div>
  </main>
  <div id="side"></div>
</div>
<script src="assets/app.js?v=20261011d"></script>
<script>
(async () => {
  const S = await layout('noti');
  $('#side').innerHTML = sideBox(S);
  const seen = localStorage.getItem(notiKey()) || '';
  let items;
  try { items = (await api('mynoti')).items || []; }
  catch (e) { $('#list').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; return; }
  notiStore(items); notiSeen();   // 이 화면을 보면 이름 위 숫자가 사라짐
  const F = ['전체', '댓글', '참가신청']; let f = '전체';
  const SC = { '대기': 's1', '수락': 's2', '거절': 's3' };
  const draw = () => {
    $('#ntf').innerHTML = items.length ? F.map(k => '<button data-f="' + k + '" class="' + (k === f ? 'on' : '') + '">' + k + ' ' + (k === '전체' ? items.length : items.filter(x => x.kind === k).length) + '</button>').join('') : '';
    const list = items.filter(x => f === '전체' || x.kind === f);
    $('#list').innerHTML = !items.length
      ? '<div class="nt-empty">아직 받은 알림이 없습니다.<br>자유게시판이나 조인게시판에 글을 쓰면, 그 글에 달린 댓글과 참가 신청이 여기에 모입니다.</div>'
      : !list.length ? '<div class="nt-empty">해당하는 알림이 없습니다.</div>'
      : list.map(x => {
          const nw = x.at > seen;
          return '<a class="nt' + (nw ? ' new' : '') + '" href="' + esc(x.href) + '">' +
            '<div class="nt-top"><span class="nt-k' + (x.kind === '참가신청' ? ' j' : '') + '">' + esc(x.kind) + '</span>' +
            (x.state ? '<span class="nt-s ' + (SC[x.state] || '') + '">' + esc(x.state === '대기' ? '수락 대기' : x.state) + '</span>' : '') +
            (nw ? '<span class="nt-new">새 소식</span>' : '') + '<span class="nt-at">' + esc(x.at) + '</span></div>' +
            '<div class="nt-t">' + esc(x.where) + ' · ' + esc(x.title) + '</div>' +
            '<div class="nt-b"><b>' + esc(x.nick) + '</b>' + esc(x.text || (x.kind === '참가신청' ? '참가를 신청했습니다.' : '')) + '</div></a>';
        }).join('');
  };
  $('#ntf').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { f = b.dataset.f; draw(); } };
  draw();
})();
</script>
</body>
</html>
