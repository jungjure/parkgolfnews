<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파크골프뉴스</title>
<meta name="description" content="파크골프뉴스 기사">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta property="og:site_name" content="파크골프뉴스">
<meta property="og:type" content="website">
<meta property="og:title" content="파크골프뉴스">
<meta property="og:description" content="전국 파크골프 소식과 대회 뉴스를 전합니다.">
<meta property="og:url" content="https://parkgolfnews.org/article.html">
<meta property="og:image" content="https://parkgolfnews.org/assets/pgn_logo_card.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="1280">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://parkgolfnews.org/assets/pgn_logo_card.jpg">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261010d">
</head>
<body>
<div class="wrap cols">
  <main class="article" id="art"><div class="loading">불러오는 중...</div></main>
  <div id="side"></div>
</div>
<script src="assets/app.js?v=20261010d"></script>
<script>
(async () => {
  const S = await layout('news');
  $('#side').innerHTML = sideBox(S);
  const id = new URLSearchParams(location.search).get('id');
  try {
    const all = await getNews();
    const n = all.find(x => x.id === id);
    if (!n) { $('#art').innerHTML = '<div class="empty">기사를 찾을 수 없습니다.<br><br><a class="btn green" href="news.html">뉴스 목록으로</a></div>'; return; }
    document.title = n.title + ' - 파크골프뉴스';
    const setMeta = (sel, attr, v) => { let m = document.querySelector(sel); if (!m) { m = document.createElement('meta'); document.head.appendChild(m); } m.setAttribute(attr, v); };
    setMeta('meta[name=description]', 'content', n.summary);
    const og = (p, v) => { let m = document.querySelector(`meta[property="${p}"]`); if (!m) { m = document.createElement('meta'); m.setAttribute('property', p); document.head.appendChild(m); } m.setAttribute('content', v); };
    og('og:title', n.title); og('og:description', n.summary); og('og:type', 'article'); if (n.images[0]) og('og:image', n.images[0]);
    const idx = all.indexOf(n), prev = all[idx + 1], next = all[idx - 1];
    $('#art').innerHTML = `
      <span class="tag">${esc(n.cat)}</span>
      <h1>${esc(n.title)}</h1>
      <div class="meta">${fmtDate(n.date)}${n.writer ? ' · ' + esc(n.writer) : ' · 파크골프뉴스'}</div>
      <div class="content">${n.images.map(u => `<img src="${esc(u)}" alt="${esc(n.title)}" loading="lazy">`).join('')}${renderBody(n)}</div>
      ${n.link ? `<div class="src">${n.source ? esc(n.source) + ' · ' : '관련 링크 · '}<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.link)}</a></div>` : ''}
      <div class="share">
        <button class="btn" style="background:#FEE500;color:#191919;border-color:#FEE500" onclick="shareKakao()">카카오톡 공유</button>
        <button class="btn" style="background:#00C73C;color:#fff;border-color:#00C73C" onclick="shareBand()">밴드 공유</button>
        <button class="btn green" onclick="copyText(location.href);this.textContent='주소가 복사되었습니다'">기사 주소 복사</button>
        <a class="btn green" href="news.html">목록</a>
      </div>
      <p class="rxhead">이 기사 어떠셨나요?</p>
      <div class="rx big" data-id="${esc(n.id)}"></div>
      <section class="card comments" id="cm"><h3>댓글 <span id="ccount"></span></h3><div id="cbox"></div><div id="clist"><div class="loading">불러오는 중...</div></div></section>
      <div class="grid" style="margin-top:24px">${[next, prev].filter(Boolean).map(newsCard).join('')}</div>`;
    loadComments(n.id);
  } catch (e) { showError($('#art'), e); }

  async function loadComments(aid) {
    const me = Auth.get(), here = location.pathname.split('/').pop() + location.search;
    $('#cbox').innerHTML = me
      ? '<div class="cform"><textarea id="ctext" maxlength="1000" placeholder="댓글을 입력하세요 (1000자 이내)"></textarea><div class="bar"><small>' + esc(me.name) + '님으로 작성</small><button class="btn green" id="csend">댓글 등록</button></div><div id="cmsg"></div></div>'
      : '<div class="cneed">댓글은 회원만 쓸 수 있습니다.<br><a class="btn green" href="login.html?next=' + encodeURIComponent(here) + '">로그인</a><a class="btn green" href="signup.html?next=' + encodeURIComponent(here) + '">회원가입</a></div>';
    const draw = async () => {
      try {
        const r = await api('comments', { aid });
        $('#ccount').textContent = r.items.length ? '(' + r.items.length + ')' : '';
        $('#clist').innerHTML = r.items.length ? r.items.map(c => '<div class="citem"><div class="ch"><b>' + esc(c.nick) + '</b><span>' + esc(c.at) + '</span>' + (c.mine ? '<button data-id="' + esc(c.id) + '">삭제</button>' : '') + '</div><div class="ct">' + esc(c.text) + '</div></div>').join('') : '<div class="empty" style="padding:18px">첫 댓글을 남겨 보세요.</div>';
      } catch (e) { $('#clist').innerHTML = '<div class="empty" style="padding:18px">댓글을 불러오지 못했습니다.<br><small>' + esc(e.message) + '</small></div>'; }
    };
    await draw();
    $('#clist').onclick = async e => {
      const b = e.target.closest('button[data-id]'); if (!b || !confirm('이 댓글을 삭제할까요?')) return;
      try { await api('cdelete', { cid: b.dataset.id }); draw(); } catch (err) { alert(err.message); }
    };
    const send = $('#csend'); if (!send) return;
    send.onclick = async () => {
      const t = $('#ctext').value.trim(), m = $('#cmsg'); if (!t) { m.innerHTML = '<div class="msg err">댓글 내용을 입력해 주세요.</div>'; return; }
      send.disabled = true; send.textContent = '등록 중...'; m.innerHTML = '';
      try { await api('cpost', { aid, text: t }); $('#ctext').value = ''; await draw(); }
      catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; if (!Auth.get()) setTimeout(() => location.reload(), 1500); }
      send.disabled = false; send.textContent = '댓글 등록';
    };
  }
})();
</script>
</body>
</html>
