<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원현황 - 파크골프뉴스</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261010f">
<style>
.mstat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mstat .box{flex:1;min-width:140px;padding:14px 16px;text-align:center}
.mstat b{display:block;font-size:1.7rem;color:var(--g900)}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.mtools input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem}
.mtools .btn{padding:8px 16px;border-color:var(--g700);color:var(--g900);background:#fff}
.mtable{overflow-x:auto}
.mtable table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:620px}
.mtable th,.mtable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mtable th{background:var(--g100);color:var(--g900)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px}
.dot.on{background:#1aa84b;box-shadow:0 0 0 3px #d4f5df}
.mtable a.tel{font-weight:800;color:var(--g700);text-decoration:none}
.mtable small{color:#777}
</style>
</head>
<body>
<script src="assets/app.js?v=20261010f"></script>
<script>
(async () => {
  const me = Auth.get();
  if (!me) { location.replace('login.html?next=members.html'); return; }
  if (me.role !== 'admin') { location.replace('index.html'); return; }
  await layout('members');
  document.querySelector('footer.site').insertAdjacentHTML('beforebegin', '<div class="wrap" id="mw"><main class="article" style="max-width:none"><h2 class="sec">회원현황 <small style="font-size:.6em;color:#777">관리자 전용</small></h2><div class="mstat"><div class="card box"><b id="nOn">-</b>지금 접속 중</div><div class="card box"><b id="nAll">-</b>전체 회원</div></div><div class="mtools"><input id="q" placeholder="닉네임·아이디·전화번호·지역 검색"><button class="btn" id="rf">새로고침</button><small id="upd" style="color:#777"></small></div><div id="msg"></div><div class="card mtable"><table><thead><tr><th>접속</th><th>닉네임</th><th>아이디</th><th>휴대폰</th><th>지역</th><th>최근 접속</th><th>가입일</th><th>이메일</th></tr></thead><tbody id="tb"></tbody></table></div><p style="color:#777;font-size:.9rem">접속 중 = 최근 5분 안에 사이트를 열어 둔 로그인 회원. 휴대폰 번호는 개인정보이므로 외부에 공유하지 마세요. 번호가 비어 있는 회원은 번호 입력 기능이 생기기 전에 가입한 분입니다.</p></main></div>');
  let items = [];
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase().replace(/-/g, '');
    const rows = items.filter(x => !q || (x.nick + ' ' + x.id + ' ' + x.phone.replace(/-/g, '') + ' ' + (x.region || '')).toLowerCase().includes(q));
    $('#tb').innerHTML = rows.map(x => '<tr' + (x.status !== '정상' ? ' style="opacity:.5"' : '') + '><td><span class="dot ' + (x.online ? 'on' : '') + '"></span>' + (x.online ? '접속 중' : '') + '</td><td><b>' + esc(x.nick) + '</b>' + (x.status !== '정상' ? ' <small>(' + esc(x.status) + ')</small>' : '') + '</td><td>' + esc(x.social ? x.social + ' 로그인' : x.id) + '</td><td>' + (x.phone ? '<a class="tel" href="tel:' + esc(x.phone.replace(/-/g, '')) + '">' + esc(x.phone) + '</a>' : '<small>미등록</small>') + '</td><td>' + (x.region ? esc(x.region) : '<small>미입력</small>') + '</td><td>' + esc(x.seen ? x.seen.slice(0, 16) : '-') + '</td><td>' + esc(x.joined.slice(0, 10)) + '</td><td>' + esc(x.email) + '</td></tr>').join('') || '<tr><td colspan="8" style="text-align:center;color:#777;padding:24px">회원이 없습니다.</td></tr>';
  };
  const load = async () => {
    try {
      const r = await api('members');
      items = r.items; $('#nOn').textContent = r.online; $('#nAll').textContent = r.total; $('#msg').innerHTML = '';
      $('#upd').textContent = new Date().toLocaleTimeString('ko-KR') + ' 기준'; draw();
    } catch (e) {
      if (!Auth.get()) { location.replace('login.html?next=members.html'); return; }
      $('#msg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  };
  $('#q').oninput = draw; $('#rf').onclick = load;
  load(); setInterval(() => { if (!document.hidden) load(); }, 30000);
})();
</script>
</body>
</html>
