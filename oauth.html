<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 처리 중 - 파크골프뉴스</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261022b">
</head>
<body>
<div class="wrap"><div class="card authbox" style="text-align:center"><h2>로그인 처리 중</h2><div id="st" class="loading">잠시만 기다려 주세요...</div></div></div>
<script src="assets/app.js?v=20261113i"></script>
<script>
(async () => {
  await layout('login');
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));   /* 구글은 주소 # 뒤로 id_token 이 옴 */
  const code = q.get('code'), idt = h.get('id_token'), state = q.get('state') || h.get('state') || '';
  const saved = sessionStorage.getItem('pgn_oauth_state'), next = sessionStorage.getItem('pgn_oauth_next') || '';
  const fail = t => { $('#st').className = 'msg err'; $('#st').innerHTML = esc(t) + '<br><br><a class="btn green" href="login.html">로그인 화면으로</a>'; };
  if (location.hash) history.replaceState(null, '', location.pathname);   /* 토큰이 주소창·기록에 남지 않게 */
  if (q.get('error') || h.get('error')) return fail('로그인이 취소되었거나 허용되지 않았습니다.');
  if (!(code || idt) || !saved || state !== saved) return fail('잘못된 접근입니다. 로그인 화면에서 다시 시도해 주세요.');
  sessionStorage.removeItem('pgn_oauth_state');
  try {
    const p = state.split('.')[0];
    const r = idt ? await api('social', { provider: 'google', credential: idt }) : await api('social', { provider: p, code, state, redirect: OAUTH_REDIRECT });
    $('#st').textContent = '확인되었습니다.';
    socialResult(r, next);
  } catch (e) { fail(e.message); }
})();
</script>
</body>
</html>
