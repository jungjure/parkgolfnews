<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기사 검색 - 파크골프세계</title>
<meta name="description" content="파크골프세계 전체 기사에서 검색어가 들어간 기사를 찾아 보여 줍니다.">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta property="og:site_name" content="파크골프세계">
<meta property="og:type" content="website">
<meta property="og:title" content="파크골프세계 기사 검색">
<meta property="og:image" content="https://parkgolfnews.org/assets/pgn_logo_card.jpg">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261022b">
<style>
/* 글꼴은 style.css의 Pretendard(OFL)만 사용 */
.sres{list-style:none;margin:0;padding:0}
.sres li{border-bottom:1px solid var(--line)}
.sres a{display:flex;gap:14px;padding:16px 4px;color:inherit;text-decoration:none}
.sres a:hover h3{text-decoration:underline}
.sres .th{flex:0 0 112px;height:76px;border-radius:10px;overflow:hidden;background:var(--g50)}
.sres .th img{width:100%;height:100%;object-fit:cover;display:block}
.sres .tx{min-width:0;flex:1}
.sres h3{margin:2px 0 6px;font-size:1.08rem;line-height:1.4}
.sres p{margin:0 0 6px;font-size:.93rem;line-height:1.6;color:#333;word-break:keep-all;overflow-wrap:anywhere}
.sres .mt{font-size:.82rem;color:#666}
.sres mark{background:#fff3a0;color:inherit;padding:0 1px;border-radius:3px}
.scount{margin:6px 0 4px;font-size:.95rem}
.scount b{color:var(--g700)}
@media(max-width:620px){.sres .th{flex-basis:84px;height:60px}.sres h3{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap cols">
  <main>
    <h2 class="sec">기사 검색</h2>
    <form class="toolbar" id="sf" role="search"><input type="search" id="q" name="q" placeholder="검색어 (제목·내용 전체)" maxlength="40" aria-label="검색어"><button class="btn green" type="submit">검색</button></form>
    <div class="scount" id="cnt"></div>
    <div id="list"></div>
  </main>
  <div id="side"></div>
</div>
<script src="assets/app.js?v=20261110c"></script>
<script>
(async () => {
  const S = await layout('search');
  $('#side').innerHTML = sideBox(S);
  const strip = h => { const t = document.createElement('textarea'); t.innerHTML = String(h || '').replace(/<(script|style|head)[\s\S]*?<\/\1>/gi, ' ').replace(/<br\s*\/?>|<\/(p|div|li|h\d|tr)>/gi, ' ').replace(/<[^>]*>/g, ' '); return t.value.replace(/\s+/g, ' ').trim(); };
  const nb = s => (typeof noBandUrl === 'function' ? noBandUrl(s) : s);
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let all = null, ready = null;
  const load = () => ready || (ready = (async () => { all = await getNews(); await withBodies(all).catch(() => {}); all.forEach(n => { n._t = strip(nb(n.body || n.summary)); }); })());
  const snip = (text, words) => {
    const low = text.toLowerCase(); let at = -1;
    for (const w of words) { const i = low.indexOf(w.toLowerCase()); if (i >= 0 && (at < 0 || i < at)) at = i; }
    if (at < 0) return text.slice(0, 140) + (text.length > 140 ? '…' : '');
    const s = Math.max(0, at - 50), e = Math.min(text.length, at + 110);
    return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
  };
  const mark = (s, words) => { let h = esc(s); words.forEach(w => { h = h.replace(new RegExp('(' + reEsc(esc(w)) + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  const run = async q => {
    q = (q || '').trim(); $('#q').value = q;
    document.querySelectorAll('.msearch input').forEach(i => { i.value = q; });
    if (!q) { $('#cnt').textContent = '검색어를 넣고 검색을 눌러 주세요.'; $('#list').innerHTML = ''; return; }
    document.title = q + ' 검색 - 파크골프세계';
    $('#cnt').textContent = ''; $('#list').innerHTML = '<div class="loading">기사 내용을 찾는 중...</div>';
    await load();
    const words = q.split(/\s+/).filter(Boolean);
    const f = all.filter(n => { const hay = (n.title + ' ' + n.cat + ' ' + n._t).toLowerCase(); return words.every(w => hay.includes(w.toLowerCase())); });
    window.PGN_SHARE = () => '파크골프세계 기사 검색 "' + q + '" ' + f.length + '건';
    $('#cnt').innerHTML = '<b>' + esc(q) + '</b> 검색 결과 <b>' + f.length + '</b>건 (전체 기사 ' + all.length + '건 중, 최신순)';
    $('#list').innerHTML = f.length ? '<ul class="sres">' + f.map(n => { const img = n.images[0]; return '<li><a href="article.html?id=' + esc(n.id) + '"><div class="th">' + (img ? '<img src="' + esc(thumbUrl(img)) + '" alt="" loading="lazy">' : '<img src="assets/logo.png" alt="" style="object-fit:contain;padding:10px">') + '</div><div class="tx"><h3>' + mark(n.title, words) + '</h3><p>' + mark(snip(n._t, words), words) + '</p><div class="mt">' + esc(n.cat) + ' · ' + fmtDate(n.date) + '</div></div></a></li>'; }).join('') + '</ul>' : '<div class="empty">"' + esc(q) + '"가 들어간 기사가 없습니다.<br>다른 검색어로 찾아 보세요.</div>';
  };
  $('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); history.replaceState(null, '', 'search.html' + (q ? '?q=' + encodeURIComponent(q) : '')); run(q); };
  try { await run(new URLSearchParams(location.search).get('q')); } catch (e) { showError($('#list'), e); }
})();
</script>
</body>
</html>
