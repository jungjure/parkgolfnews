<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구장 날씨 · 파크골프뉴스</title>
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;background:#F7F3EA;color:#14342A;-webkit-text-size-adjust:100%}
.top{background:#14342A;color:#F0D9A6;padding:14px 18px;font-size:14px;font-weight:700;letter-spacing:.02em}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;line-height:1.35;margin:4px 0 2px}
.sub{font-size:14px;color:#5b6b63;margin-bottom:14px}
.card{background:#fff;border:1px solid #e3dccd;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:800;margin-bottom:8px}
.sum{font-size:17px;font-weight:700;line-height:1.5}
.sum b{color:#B5543C}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 4px;border-top:1px solid #eee6d6;text-align:center}
td:first-child{text-align:left;font-weight:700}
.rain{color:#2E6E62;font-weight:700}
.tip{font-size:14px;color:#B5543C;font-weight:700;margin-top:8px}
.note{font-size:12.5px;color:#5b6b63;line-height:1.6;margin-top:6px}
.load{font-size:15px;color:#5b6b63;padding:20px 0}
</style>
</head>
<body>
<div class="top">PARKGOLF NEWS · 구장 날씨</div>
<div class="wrap">
  <h1 id="nm">구장 날씨</h1>
  <div class="sub" id="sub"></div>
  <div id="out"><p class="load">날씨를 불러오는 중입니다...</p></div>
  <p class="note">날씨 자료: Open-Meteo (CC BY 4.0). 예보는 바뀔 수 있으니 출발 전에 한 번 더 확인해 주세요.</p>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var n=q.get('n')||'구장', lat=parseFloat(q.get('lat')), lng=parseFloat(q.get('lng'));
  document.getElementById('nm').textContent=n+' 날씨'; document.title=n+' 날씨 · 파크골프뉴스';
  var W={0:'맑음',1:'대체로 맑음',2:'구름 조금',3:'흐림',45:'안개',48:'안개',51:'이슬비',53:'이슬비',55:'이슬비',56:'어는 이슬비',57:'어는 이슬비',61:'약한 비',63:'비',65:'강한 비',66:'어는 비',67:'어는 비',71:'약한 눈',73:'눈',75:'강한 눈',77:'싸락눈',80:'소나기',81:'소나기',82:'강한 소나기',85:'눈 소나기',86:'눈 소나기',95:'뇌우',96:'뇌우',99:'뇌우'};
  var days=['일','월','화','수','목','금','토'];
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=3&wind_speed_unit=ms';
  fetch(url).then(function(r){return r.json()}).then(function(d){
    var h=d.hourly, dl=d.daily, out='';
    for(var k=0;k<2;k++){
      var day=dl.time[k], dt=new Date(day+'T00:00:00+09:00');
      var label=(k===0?'오늘':'내일')+' '+(dt.getMonth()+1)+'월 '+dt.getDate()+'일('+days[dt.getDay()]+')';
      var rows='';
      for(var i=0;i<h.time.length;i++){var t=h.time[i]; if(t.indexOf(day)!==0)continue; var hr=parseInt(t.slice(11,13),10); if(hr<6||hr>18||hr%2)continue;
        rows+='<tr><td>'+hr+'시</td><td>'+(W[h.weather_code[i]]||'')+'</td><td>'+Math.round(h.temperature_2m[i])+'℃</td><td class="rain">'+h.precipitation_probability[i]+'%</td><td>'+h.wind_speed_10m[i].toFixed(0)+'m/s</td></tr>';}
      var pmax=dl.precipitation_probability_max[k];
      out+='<div class="card"><h2>'+label+'</h2><p class="sum">'+(W[dl.weather_code[k]]||'')+' · '+Math.round(dl.temperature_2m_min[k])+'~'+Math.round(dl.temperature_2m_max[k])+'℃ · 강수확률 <b>'+pmax+'%</b></p>'+
        (pmax>=60?'<p class="tip">비 예보가 있습니다. 우비와 여벌 장갑을 챙기세요.</p>':'')+
        '<table><tr><td>시간</td><td>날씨</td><td>기온</td><td>강수</td><td>바람</td></tr>'+rows+'</table></div>';
    }
    document.getElementById('out').innerHTML=out;
    document.getElementById('sub').textContent='오전 6시~오후 6시, 2시간 간격';
  }).catch(function(){document.getElementById('out').innerHTML='<p class="load">날씨를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</p>';});
})();
</script>
</body>
</html>
