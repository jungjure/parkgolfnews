<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 - 파크골프뉴스</title>
<meta name="description" content="파크골프뉴스 회원가입. 회원이 되면 기사에 댓글을 쓸 수 있습니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261003b">
</head>
<body>
<div class="wrap">
  <div class="card authbox">
    <h2>회원가입</h2>
    <p class="sub">가입하면 기사에 댓글을 쓸 수 있습니다.</p>
    <div id="notice"></div>
    <form id="f" autocomplete="on">
      <label class="field"><span>아이디</span><input id="id" name="username" autocomplete="username" maxlength="20" required><small>영문 소문자·숫자·밑줄(_) 4~20자</small></label>
      <label class="field"><span>닉네임 (댓글에 표시됩니다)</span><input id="nick" maxlength="12" required><small>2~12자</small></label>
      <label class="field"><span>비밀번호</span><input id="pw" name="new-password" type="password" autocomplete="new-password" maxlength="50" required><small>6자 이상</small></label>
      <label class="field"><span>비밀번호 확인</span><input id="pw2" type="password" autocomplete="new-password" maxlength="50" required></label>
      <label class="field"><span>이메일 (선택)</span><input id="email" type="email" autocomplete="email"><small>비밀번호를 잊었을 때 본인 확인용으로만 쓰입니다.</small></label>
      <div id="phBox">
        <label class="field" style="margin-bottom:6px"><span>휴대폰 번호</span><div class="phrow"><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-1234-5678" required><button type="button" id="phSend" hidden>인증번호 받기</button></div><small>운영자 연락용 (관리자만 볼 수 있습니다)</small></label>
        <div id="phCodeRow" hidden><label class="field" style="margin-bottom:6px"><div class="phrow"><input id="phCode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"><button type="button" id="phCheck">확인</button></div></label></div>
        <div id="phMsg" style="margin-bottom:12px"></div>
      </div>
      <div class="terms"><b>개인정보 수집·이용 안내</b><br>수집 항목: 아이디, 닉네임, 비밀번호(암호화 저장), 휴대폰 번호, 이메일(선택)<br>이용 목적: 회원 식별, 댓글 작성 관리, 운영자 연락(공지·문의 응대). 휴대폰 번호는 관리자만 볼 수 있으며 다른 회원에게 공개되지 않습니다.<br>보유 기간: 회원 탈퇴 요청 시까지. 탈퇴를 원하시면 연락처로 알려 주세요.<br>욕설·광고·허위 내용 댓글은 삭제될 수 있습니다.</div>
      <label class="chk"><input type="checkbox" id="agree"> 위 내용에 동의합니다</label>
      <div id="msg"></div>
      <button class="btn green big" id="go" type="submit">가입하기</button>
    </form>
    <div id="social"></div>
    <div class="linkrow">이미 회원이신가요? <a id="tologin" href="login.html">로그인</a></div>
  </div>
</div>
<script src="assets/app.js?v=20261004a"></script>
<script>
(async () => {
  await layout('signup');
  pwEye('#pw', '#pw2');
  const nextUrl = () => { const n = new URLSearchParams(location.search).get('next') || ''; return /^[\w.\-]+\.html(\?[\w=&%\-]*)?$/.test(n) ? n : ''; };
  if (nextUrl()) $('#tologin').href = 'login.html?next=' + encodeURIComponent(nextUrl());
  if (Auth.get()) { location.replace(nextUrl() || 'index.html'); return; }
  let phoneToken = '', smsOn = false;
  const pm = (t, k) => $('#phMsg').innerHTML = t ? '<div class="msg ' + (k || 'err') + '" style="margin:0">' + esc(t) + '</div>' : '';
  getConfig().then(c => {
    smsOn = !!c.sms; $('#phSend').hidden = !smsOn;
  });
  renderSocial($('#social'), nextUrl());
  const fmt = fmtPhone;
  $('#phone').addEventListener('input', e => { e.target.value = fmt(e.target.value); phoneToken = ''; $('#phCodeRow').hidden = true; pm(''); $('#phSend').textContent = '인증번호 받기'; });
  $('#phSend').onclick = async () => {
    const b = $('#phSend'); b.disabled = true; pm('');
    try { await api('smssend', { phone: $('#phone').value }); $('#phCodeRow').hidden = false; $('#phCode').value = ''; $('#phCode').focus(); pm('인증번호를 문자로 보냈습니다. 5분 안에 입력해 주세요.', 'ok'); b.textContent = '다시 받기'; setTimeout(() => b.disabled = false, 60000); }
    catch (e) { pm(e.message); b.disabled = false; }
  };
  $('#phCheck').onclick = async () => {
    const b = $('#phCheck'); b.disabled = true;
    try { const r = await api('smsverify', { phone: $('#phone').value, code: $('#phCode').value.trim() }); phoneToken = r.phoneToken; $('#phCodeRow').hidden = true; pm('휴대폰 번호 인증이 완료되었습니다.', 'ok'); }
    catch (e) { pm(e.message); }
    b.disabled = false;
  };
  if (!CONFIG.API_URL) $('#notice').innerHTML = '<div class="msg warn">서버 연결이 아직 설정되지 않았습니다.</div>';
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#go'), m = $('#msg'), err = t => { m.innerHTML = '<div class="msg err">' + esc(t) + '</div>'; };
    m.innerHTML = '';
    if ($('#pw').value !== $('#pw2').value) return err('비밀번호 확인이 일치하지 않습니다.');
    if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test($('#phone').value.trim())) return err('휴대폰 번호를 정확히 입력해 주세요. (예: 010-1234-5678)');
    if (smsOn && !phoneToken) return err('휴대폰 번호 인증을 먼저 완료해 주세요.');
    if (!$('#agree').checked) return err('개인정보 수집·이용에 동의해 주세요.');
    b.disabled = true; b.textContent = '가입 중...';
    try {
      const r = await api('signup', { id: $('#id').value.trim(), nick: $('#nick').value.trim(), pw: $('#pw').value, email: $('#email').value.trim(), phone: $('#phone').value, phoneToken, agree: true });
      Auth.set({ token: r.token, exp: r.exp, role: r.role, name: r.name || '' }, false);
      location.href = nextUrl() || 'index.html';
    } catch (e) { err(e.message); b.disabled = false; b.textContent = '가입하기'; }
  };
})();
</script>
</body>
</html>
