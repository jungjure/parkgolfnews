<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 - 파크골프뉴스</title>
<meta name="description" content="파크골프뉴스 회원가입. 회원이 되면 기사에 댓글을 쓸 수 있습니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261010e">
</head>
<body>
<div class="wrap">
  <div class="card authbox">
    <h2>회원가입</h2>
    <p class="sub">가입하시면 모든 기능을 이용하실 수 있습니다.</p>
    <div id="notice"></div>
    <form id="f" autocomplete="on">
      <label class="field"><span>아이디</span><div class="phrow"><input id="id" name="username" autocomplete="username" maxlength="20" required><button type="button" id="idChk">중복확인</button></div><small>영문 소문자·숫자·밑줄(_) 4~20자</small></label>
      <div id="idMsg" style="margin-bottom:12px"></div>
      <label class="field"><span>닉네임 (댓글에 표시됩니다)</span><input id="nick" maxlength="12" required><small>2~12자</small></label>
      <label class="field"><span>비밀번호</span><input id="pw" name="new-password" type="password" autocomplete="new-password" maxlength="50" required><small>6자 이상</small></label>
      <label class="field"><span>비밀번호 확인</span><input id="pw2" type="password" autocomplete="new-password" maxlength="50" required></label>
      <label class="field"><span>이메일 (선택)</span><input id="email" type="email" autocomplete="email"><small>비밀번호를 잊었을 때 본인 확인용으로만 쓰입니다.</small></label>
      <div id="phBox">
        <label class="field" style="margin-bottom:6px"><span>휴대폰 번호</span><div class="phrow"><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-1234-5678" required><button type="button" id="phSend" hidden>인증번호 받기</button></div><small>운영자 연락용 (관리자만 볼 수 있습니다)</small></label>
        <div id="phCodeRow" hidden><label class="field" style="margin-bottom:6px"><div class="phrow"><input id="phCode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"><button type="button" id="phCheck">확인</button></div></label></div>
        <div id="phMsg" style="margin-bottom:12px"></div>
      </div>
      <label class="field"><span>지역 (시·도 → 시·군·구)</span><div class="phrow"><select id="rg1" style="flex:1;min-width:0" required></select><select id="rg2" style="flex:1;min-width:0" required disabled></select></div><small>시·도를 먼저 고르면 시·군·구 목록이 나옵니다.</small></label>
      <div class="terms"><b>개인정보 수집·이용 안내</b><br>수집 항목: 아이디, 닉네임, 비밀번호(암호화 저장), 휴대폰 번호, 지역(시·도, 시·군·구), 이메일(선택)<br>이용 목적: 회원 식별, 댓글 작성 관리, 운영자 연락(공지·문의 응대). 휴대폰 번호는 관리자만 볼 수 있으며 다른 회원에게 공개되지 않습니다.<br>보유 기간: 회원 탈퇴 요청 시까지. 탈퇴를 원하시면 연락처로 알려 주세요.<br>욕설·광고·허위 내용 댓글은 삭제될 수 있습니다.</div>
      <label class="chk"><input type="checkbox" id="agree"> 위 내용에 동의합니다</label>
      <div id="msg"></div>
      <button class="btn green big" id="go" type="submit">가입하기</button>
    </form>
    <div id="social"></div>
    <div class="linkrow">이미 회원이신가요? <a id="tologin" href="login.html">로그인</a></div>
  </div>
</div>
<script src="assets/app.js?v=20261010e"></script>
<script>
(async () => {
  await layout('signup');
  pwEye('#pw', '#pw2');
  const nextUrl = () => { const n = new URLSearchParams(location.search).get('next') || ''; return /^[\w.\-]+\.html(\?[\w=&%\-]*)?$/.test(n) ? n : ''; };
  if (nextUrl()) $('#tologin').href = 'login.html?next=' + encodeURIComponent(nextUrl());
  if (Auth.get()) { location.replace(nextUrl() || 'index.html'); return; }
  let phoneToken = '', smsOn = false, idOk = '';
  const im = (t, k) => $('#idMsg').innerHTML = t ? '<div class="msg ' + (k || 'err') + '" style="margin:0">' + esc(t) + '</div>' : '';
  $('#id').addEventListener('input', () => { idOk = ''; im(''); });
  const idCheck = async () => {
    const v = $('#id').value.trim().toLowerCase();
    if (!/^[a-z0-9_]{4,20}$/.test(v)) { idOk = ''; im('아이디는 영문 소문자·숫자·밑줄(_) 4~20자로 입력해 주세요.'); return false; }
    const b = $('#idChk'); b.disabled = true;
    try {
      const r = await api('idcheck', { id: v });
      if (r.available) { idOk = v; im('사용할 수 있는 아이디입니다.', 'ok'); return true; }
      idOk = ''; im('이미 사용 중인 아이디입니다.'); return false;
    } catch (e) { idOk = ''; im(e.message); return false; }
    finally { b.disabled = false; }
  };
  $('#idChk').onclick = idCheck;
  $('#id').addEventListener('blur', () => { if ($('#id').value.trim() && !idOk) idCheck(); });
  const pm = (t, k) => $('#phMsg').innerHTML = t ? '<div class="msg ' + (k || 'err') + '" style="margin:0">' + esc(t) + '</div>' : '';
  getConfig().then(c => {
    smsOn = !!c.sms; $('#phSend').hidden = !smsOn;
  });
  renderSocial($('#social'), nextUrl());
  const REG = {"서울특별시":["강남구","강동구","강북구","강서구","관악구","광진구","구로구","금천구","노원구","도봉구","동대문구","동작구","마포구","서대문구","서초구","성동구","성북구","송파구","양천구","영등포구","용산구","은평구","종로구","중구","중랑구"],"부산광역시":["강서구","금정구","기장군","남구","동구","동래구","부산진구","북구","사상구","사하구","서구","수영구","연제구","영도구","중구","해운대구"],"대구광역시":["군위군","남구","달서구","달성군","동구","북구","서구","수성구","중구"],"인천광역시":["강화군","계양구","남동구","동구","미추홀구","부평구","서구","연수구","옹진군","중구"],"광주광역시":["광산구","남구","동구","북구","서구"],"대전광역시":["대덕구","동구","서구","유성구","중구"],"울산광역시":["남구","동구","북구","울주군","중구"],"세종특별자치시":[],"경기도":["가평군","고양시","과천시","광명시","광주시","구리시","군포시","김포시","남양주시","동두천시","부천시","성남시","수원시","시흥시","안산시","안성시","안양시","양주시","양평군","여주시","연천군","오산시","용인시","의왕시","의정부시","이천시","파주시","평택시","포천시","하남시","화성시"],"강원특별자치도":["강릉시","고성군","동해시","삼척시","속초시","양구군","양양군","영월군","원주시","인제군","정선군","철원군","춘천시","태백시","평창군","홍천군","화천군","횡성군"],"충청북도":["괴산군","단양군","보은군","영동군","옥천군","음성군","제천시","증평군","진천군","청주시","충주시"],"충청남도":["계룡시","공주시","금산군","논산시","당진시","보령시","부여군","서산시","서천군","아산시","예산군","천안시","청양군","태안군","홍성군"],"전북특별자치도":["고창군","군산시","김제시","남원시","무주군","부안군","순창군","완주군","익산시","임실군","장수군","전주시","정읍시","진안군"],"전라남도":["강진군","고흥군","곡성군","광양시","구례군","나주시","담양군","목포시","무안군","보성군","순천시","신안군","여수시","영광군","영암군","완도군","장성군","장흥군","진도군","함평군","해남군","화순군"],"경상북도":["경산시","경주시","고령군","구미시","김천시","문경시","봉화군","상주시","성주군","안동시","영덕군","영양군","영주시","영천시","예천군","울릉군","울진군","의성군","청도군","청송군","칠곡군","포항시"],"경상남도":["거제시","거창군","고성군","김해시","남해군","밀양시","사천시","산청군","양산시","의령군","진주시","창녕군","창원시","통영시","하동군","함안군","함양군","합천군"],"제주특별자치도":["서귀포시","제주시"]};
  const rg1 = $('#rg1'), rg2 = $('#rg2');
  rg1.innerHTML = '<option value="">시·도 선택</option>' + Object.keys(REG).map(k => '<option>' + k + '</option>').join('');
  rg2.innerHTML = '<option value="">시·군·구 선택</option>';
  rg1.addEventListener('change', () => {
    const list = REG[rg1.value] || [];
    rg2.innerHTML = '<option value="">시·군·구 선택</option>' + list.map(k => '<option>' + k + '</option>').join('');
    rg2.disabled = !list.length; rg2.required = list.length > 0; rg2.hidden = !!rg1.value && !list.length;
  });
  const fmt = fmtPhone;
  $('#phone').addEventListener('input', e => { e.target.value = fmt(e.target.value); phoneToken = ''; $('#phCodeRow').hidden = true; pm(''); $('#phSend').textContent = '인증번호 받기'; });
  $('#phSend').onclick = async () => {
    const b = $('#phSend'); b.disabled = true; pm('');
    try { await api('smssend', { phone: $('#phone').value }); $('#phCodeRow').hidden = false; $('#phCode').value = ''; $('#phCode').focus(); pm('인증번호를 문자로 보냈습니다. 5분 안에 입력해 주세요.', 'ok'); b.textContent = '다시 받기'; setTimeout(() => b.disabled = false, 60000); }
    catch (e) { pm(e.message); b.disabled = false; }
  };
  $('#phCheck').onclick = async () => {
    const b = $('#phCheck'); b.disabled = true;
    try { const r = await api('smsverify', { phone: $('#phone').value, code: $('#phCode').value.trim() }); phoneToken = r.phoneToken; $('#phCodeRow').hidden = true; pm('휴대폰 번호 인증이 완료되었습니다.', 'ok'); }
    catch (e) { pm(e.message); }
    b.disabled = false;
  };
  if (!CONFIG.API_URL) $('#notice').innerHTML = '<div class="msg warn">서버 연결이 아직 설정되지 않았습니다.</div>';
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const b = $('#go'), m = $('#msg'), err = t => { m.innerHTML = '<div class="msg err">' + esc(t) + '</div>'; };
    m.innerHTML = '';
    if (idOk !== $('#id').value.trim().toLowerCase() && !(await idCheck())) return err('아이디 중복확인을 해 주세요.');
    if ($('#pw').value !== $('#pw2').value) return err('비밀번호 확인이 일치하지 않습니다.');
    if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test($('#phone').value.trim())) return err('휴대폰 번호를 정확히 입력해 주세요. (예: 010-1234-5678)');
    if (smsOn && !phoneToken) return err('휴대폰 번호 인증을 먼저 완료해 주세요.');
    if (!rg1.value || (REG[rg1.value].length && !rg2.value)) return err('지역(시·도와 시·군·구)을 선택해 주세요.');
    if (!$('#agree').checked) return err('개인정보 수집·이용에 동의해 주세요.');
    b.disabled = true; b.textContent = '가입 중...';
    try {
      const r = await api('signup', { id: $('#id').value.trim(), nick: $('#nick').value.trim(), pw: $('#pw').value, email: $('#email').value.trim(), phone: $('#phone').value, phoneToken, region: (rg1.value + ' ' + (rg2.value || '')).trim(), agree: true });
      Auth.set({ token: r.token, exp: r.exp, role: r.role, name: r.name || '' }, false);
      location.href = nextUrl() || 'index.html';
    } catch (e) { err(e.message); b.disabled = false; b.textContent = '가입하기'; }
  };
})();
</script>
</body>
</html>
