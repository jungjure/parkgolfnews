# 2026-11-09: 홈페이지 파일이 바뀔 때마다(데이터 자동 갱신 data/** 제외) 편집일시를 data/edited.json에 기록
# 홈페이지 머리 부분 '최근 편집' 표시가 이 파일을 읽습니다.
name: 편집일시 기록
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
permissions:
  contents: write
concurrency:
  group: edited-stamp
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 편집일시 쓰기
        env:
          TS: ${{ github.event.head_commit.timestamp }}
        run: |
          T=$(TZ=Asia/Seoul date -d "$TS" '+%Y-%m-%d %H:%M')
          mkdir -p data
          printf '{"t":"%s"}\n' "$T" > data/edited.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edited.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 편집일시 $T"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
